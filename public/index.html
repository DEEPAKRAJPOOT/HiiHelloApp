<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Chat Module Demo</title>
	<style type="text/css">
		* 					{ font-family: 'Roboto Mono'; }
		body 				{ width: 960px; margin: 0 auto; }
		textarea			{ resize: none; border: dashed 2px #a9a9a9; width: 100%;}
		input[type='text'] 	{ width: 20%; }
		.fright				{ float: right; }
		.fleft				{ float: left; }
		.clearfix			{ clear: both; }
		.hide				{ display: none; }
		.mb-10				{ margin-bottom: 10px; }
		.mt-10				{ margin-top: 10px; }
	</style>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body>
	<h1>Chat Module Demo</h1>
	<hr size="2" color="#e1e1e1">
	<div id="message-history" class="hide mb-10">
		<hr size="2" color="#e1e1e1">
	</div>

	<div>
		<input type="text" id="room" placeholder="Enter Your Room Code" value="1">
		<input type="text" id="username" placeholder="Enter Your Username" value="kmjadeja">
		<button id="connectToRoom" class="mb-10 mt-10">Connect To Room</button>	
		<button id="disconnectFromRoom" class="mb-10 mt-10">Disconnect From Chat Room</button>	
		<textarea rows="5" id="messageArea"></textarea>
		<br> <br>
		<button id="sendMessage">Send Message</button>		
		<button id="sendFile">Send File</button>		
		<button id="shareLocation">Share Location</button>		
		<button id="deliveredMessage">Delivered Message</button>		
		<button id="readMessage">Read Message</button>		
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.1/socket.io.js"></script>
	<script type="text/javascript">
		$(document).ready(function() {
			// var socket = io.connect('http://127.0.0.1:8081');
			var socket = io.connect('http://chat.hihelloapp.com:8080');
			// var socket = io.connect('http://chat.hihelloapp.com');
			console.log(socket);

			/* Join The Socket Room */
				$('#connectToRoom').on('click', function () {
					socket.emit('join', {
						room: $('#room').val(),
						user: $('#username').val(),
					})
				});

			/* Left the socket */
				$('#disconnectFromRoom').on('click', function () {
					socket.emit('disconnect', { room: $('#room').val() });
				});

			/* Send Message */
				$('#sendMessage').on('click', function () {
					var value = $("#messageArea").val();

					var message = {
						'id' 	 : 	'cc79cdcv9ve8ev',
						// 'room' 	 : 	$('#room').val(),
						'room' 	 : 	'pp7wrUU7cLiKkNJAaGOO',
						'creator_id' 	 : 	1,
						'participate_id' 	 : 	2,
						// 'value'  : 	,
						'value'  : 	'{ "type" : "text", "value" : "'+value+'" , "other" : [] }',
						'time'  : 	'2022-02-10',
					};

					socket.emit('message',{
						message: message,
						user: $('#username').val(),
					});
				});

			/* Send Message */
				$('#sendFile').on('click', function () {
					var message = {
						'id' 	 : 	'cc79cdcv9ve8ev',
						'room' 	 : 	'pp7wrUU7cLiKkNJAaGOO',
						'creator_id' 	 : 	1,
						'participate_id' 	 : 	2,
						'value'  : 	'{ "type" : "file", "value" : "File1.jpg", "other" : { "path" : "/file/path/file1.jpg", "type" : ".jpg" } }',
						'time'  : 	'2022-02-10',
					};

					socket.emit('message',{
						message: message,
						user: $('#username').val(),
					});
				});

			/* Share Location */
				$('#shareLocation').on('click', function () {
					var message = {
						'id' 	 			: 	'cc79cdcv9ve8ev',
						'room' 	 			: 	'pp7wrUU7cLiKkNJAaGOO',
						'creator_id' 		: 	1,
						'participate_id' 	: 	2,
						'value'  			: 	'{ "type" : "location", "value" : "STRING", "other" : { "lat" : "LATITUDE", "lng" : "LONGITUDE" } }',
						'time'  			: 	'2022-02-10',
					};

					socket.emit('message',{
						message: message,
						user: $('#username').val(),
					});
				});

			/* Delivered Message */
				$('#deliveredMessage').on('click', function () {
					var message = {
						'id' 	 : 	'cc7923434cdcv9ve8ev',
						'room' 	 : 	'pp7wrUU7cLiKkNJAaGOO',
						'sender_id' 	: 	1,
						'receiver_id' 	: 	1,
					};

					socket.emit('message-delivered',{
						message: message,
						sender_id: 1,
						user: $('#username').val(),
					});
				});

			/* Read Message */
				$('#readMessage').on('click', function () {
					var message = {
						'id' 	 : 	'cc7923434cdcv9ve8ev',
						'room' 	 : 	'pp7wrUU7cLiKkNJAaGOO',
						'sender_id' 	: 	1,
						'receiver_id' 	: 	1,
					};

					socket.emit('read-message',{
						message: message,
						sender_id: 1,
						user: $('#username').val(),
					});
				});


			/* Receive All Emits */
				// socket.on('typing', function(response) {
				// 	if (response.user != $('#username').val()) {
				// 		$('#showTyping').html( response.user+" is typing...");
				// 		$('#showTyping').removeClass('hide')
				// 		setTimeout(function () {
				// 			if ( !$('#showTyping').hasClass('hide') ) $('#showTyping').addClass('hide')
				// 		}, 2000)
				// 	}
				// });

				socket.on('message', function(response) {
					// APPEND MESSAGE
					// CLEAR TEXT AREA
				});
		});
	</script>
</body>
</html>
