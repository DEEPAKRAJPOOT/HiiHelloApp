name: Backend HI-Hello to dev

on:
  push:
    branches: [ "dev-branch" ]
  pull_request:
    branches: [ "dev-branch" ]
    
jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '7.4'
    - uses: actions/checkout@v3
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    #- name: Execute tests (Unit and Feature tests) via PHPUnit
     # env:
        #DB_CONNECTION: sqlite
       # DB_DATABASE: database/database.sqlite
      #run: vendor/bin/phpunit
  deploy-to-cronserver:
     runs-on: self-hosted
     needs: [ laravel-tests]
     steps:
           - name: connect to aws cli
             uses: appleboy/ssh-action@master
             with:
                  host: 65.1.31.65
                  username: ubuntu
                  key: ${{ secrets.CRON_SERVER_ACCESS }}
                  port: 22
                  script: |
                      cd  /var/www/hihelloapp.com 
                      git reset --hard HEAD 
                      git pull origin dev-branch  && git checkout  dev-branch
                      sudo php artisan optimize:clear
                      php artisan config:clear
                      php artisan route:clear
                      php artisan view:clear
                      php artisan event:clear
                      sudo php artisan cache:clear
                      
                      
  deploy-to-backendserver:
     runs-on: self-hosted
     needs: [ laravel-tests]
     steps:
           - name: connect to aws cli
             uses: appleboy/ssh-action@master
             with:
                  host: 13.234.113.229
                  username: ubuntu
                  key: ${{ secrets.BACKEND_SERVER_LARAVEL }}
                  port: 22
                  script: |
                      cd  /var/www/hihelloapp.com 
                      git reset --hard HEAD 
                      git pull origin dev-branch  && git checkout  dev-branch
                      sudo php artisan optimize:clear
                      php artisan config:clear
                      php artisan route:clear 
                      php artisan view:clear
                      php artisan event:clear
                      sudo php artisan cache:clear 
                      
